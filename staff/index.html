<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Staff — MSB | UESTC</title>
  <meta name="description" content="Members of the MSB (Mapping Schizophrenia Brain) group at UESTC.">
  <link rel="icon" type="image/svg+xml" href="/assets/img/logo-square.svg">
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body data-page="staff">
  <div id="site-header"></div>

  <main>
    <section class="page-head">
      <div class="wrap">
        <h1 data-i18n="staff.title"></h1>
        <p data-i18n="staff.lead"></p>
      </div>
    </section>

    <section class="page-body">
      <div class="wrap" id="staff-root">
        <h2 class="block-title" data-i18n="staff.pi"></h2>
        <div id="pi-slot"></div>

        <h2 class="block-title" data-i18n="staff.phd"></h2>
        <div class="people-grid" id="phd-slot"></div>

        <h2 class="block-title" data-i18n="staff.master"></h2>
        <div class="people-grid" id="master-slot"></div>

        <h2 class="block-title" data-i18n="staff.alumni"></h2>
        <div class="people-grid" id="alumni-slot"></div>

        <h2 class="block-title" data-i18n="gallery.title"></h2>
        <div class="carousel" id="gallery-carousel"></div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>
  <script src="/assets/js/site.js"></script>
  <script src="/assets/js/staff.js"></script>
  <script src="/assets/js/carousel.js"></script>
  <script>MSBPeople.renderPage();</script>
</body>
</html>
